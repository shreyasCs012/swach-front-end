    <g transform="translate(20 20)">
      <rect x="0" y="90" width="130" height="210" rx="28" fill="url(#spray)"/>
      <rect x="28" y="50" width="74" height="52" rx="14" fill="#0ea5e9"/>
      <rect x="58" y="22" width="16" height="30" rx="8" fill="#0369a1"/>
      <rect x="66" y="8" width="48" height="16" rx="8" fill="#0c4a6e"/>
